# Run/event/schedule storage in Postgres so the webserver and daemon share state.
storage:
  postgres:
    postgres_db:
      hostname: {env: WAREHOUSE_HOST}
      username: {env: WAREHOUSE_USER}
      password: {env: WAREHOUSE_PASSWORD}
      db_name: dagster
      port: 5432
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2
telemetry:
  enabled: false
