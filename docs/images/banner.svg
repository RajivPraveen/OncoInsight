  <text x="56" y="92" fill="#ffffff" fill-opacity="0.85" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" letter-spacing="3">BREAST CANCER TREATMENT &amp; OUTCOMES INTELLIGENCE</text>
