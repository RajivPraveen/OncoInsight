<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="OncoInsight - where breast cancer patients wait too long for treatment">
  <rect width="1200" height="260" rx="20" fill="#f7f7f5"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="20" fill="none" stroke="#ecebe7"/>
  <!-- the patient journey: diagnosis, surgery, chemotherapy, hormone therapy, radiation, follow-up -->
  <line x1="760" y1="150" x2="1130" y2="150" stroke="#ecebe7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="760" cy="150" r="11" fill="#4b5563" stroke="#fff" stroke-width="3"/>
  <circle cx="834" cy="150" r="11" fill="#3b6ea8" stroke="#fff" stroke-width="3"/>
  <circle cx="908" cy="150" r="11" fill="#d0643c" stroke="#fff" stroke-width="3"/>
  <circle cx="982" cy="150" r="11" fill="#d19a1e" stroke="#fff" stroke-width="3"/>
  <circle cx="1056" cy="150" r="11" fill="#2f9a7e" stroke="#fff" stroke-width="3"/>
  <circle cx="1130" cy="150" r="11" fill="#3b6ea8" stroke="#fff" stroke-width="3"/>
  <g font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">
    <text x="760" y="124">Diagnosis</text><text x="834" y="186">Surgery</text><text x="908" y="124">Chemo</text>
    <text x="982" y="186">Hormone</text><text x="1056" y="124">Radiation</text><text x="1130" y="186">Follow-up</text>
  </g>
  <g font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="56" y="84" fill="#a8456b" font-size="14" font-weight="600" letter-spacing="3">BREAST CANCER CARE ANALYTICS</text>
    <text x="54" y="142" fill="#1c1f24" font-size="56" font-weight="700">OncoInsight</text>
    <text x="56" y="184" fill="#4b5563" font-size="20">Where do breast cancer patients wait too long for treatment,</text>
    <text x="56" y="212" fill="#4b5563" font-size="20">and what does it mean for them? 1,098 real patients.</text>
  </g>
</svg>
