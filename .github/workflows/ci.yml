name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ONCO_ENV: ci
  WAREHOUSE_HOST: localhost
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: oncoinsight
  WAREHOUSE_USER: oncoinsight
  WAREHOUSE_PASSWORD: oncoinsight
  WAREHOUSE_READER_USER: onco_reader
  WAREHOUSE_READER_PASSWORD: onco_reader
  DBT_TARGET: ci

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11", enable-cache: true}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src app dagster_project tests scripts
      - name: Unit tests
        run: uv run pytest tests/unit -o addopts="" -q
        env: {ONCO_SKIP_INTEGRATION: "1"}

  pipeline-integration:
    # Runs the full pipeline OFFLINE on committed fixtures (a deterministic sample of the real public data):
    # fixtures -> FHIR -> Great Expectations -> Postgres -> dbt build (models + tests) -> analytics -> alerts -> API tests
    needs: lint-and-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oncoinsight
          POSTGRES_USER: oncoinsight
          POSTGRES_PASSWORD: oncoinsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oncoinsight" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.11", enable-cache: true}
      - run: uv sync --frozen
      - name: Create roles and schemas (same script as docker init)
        run: bash docker/postgres/init/01_roles.sh
        env: {PGHOST: localhost, PGPASSWORD: oncoinsight, POSTGRES_USER: oncoinsight, POSTGRES_DB: oncoinsight}
      - name: Stage fixtures and run the pipeline
        env: {ONCO_DATA_DIR: "${{ runner.temp }}/onco-data"}
        run: |
          uv run python scripts/load_fixtures.py
          uv run python -m oncoinsight.pipeline fhir
          uv run python -m oncoinsight.pipeline load
          cd dbt/oncoinsight
          uv run dbt seed --profiles-dir .
          uv run dbt build --profiles-dir . --vars '{min_patient_rows: 100, min_metabric_rows: 200}'
          cd ../..
          uv run python -m oncoinsight.pipeline analytics
          uv run python -m oncoinsight.pipeline monitor
      - name: Integration tests (API, read-only role, reconciliation)
        env: {ONCO_DATA_DIR: "${{ runner.temp }}/onco-data"}
        run: uv run pytest tests/integration -o addopts="" -q
      - name: dbt docs artifact
        run: cd dbt/oncoinsight && uv run dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/oncoinsight/target/*.json

  docker-build:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: oncoinsight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: infra/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
