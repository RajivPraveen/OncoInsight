[project]
name = "oncoinsight"
version = "1.0.0"
description = "OncoInsight: breast cancer treatment pathways and outcomes analytics platform built on real public oncology data (TCGA-BRCA, METABRIC)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ingestion / ETL
    "httpx>=0.27",
    "tenacity>=8.5",
    "polars>=1.8",
    "pyarrow>=17",
    "boto3>=1.35",
    "fhir.resources>=8.0",
    # warehouse
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0,<2.1",  # 2.1 switches the default postgresql:// driver to psycopg3, which breaks dagster-postgres
    "dbt-core>=1.9,<1.11",
    "dbt-postgres>=1.9,<1.11",
    # quality
    "great-expectations>=1.3,<2",
    # analytics
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lifelines>=0.29",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    # orchestration
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
    "dagster-postgres>=0.25",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
    "plotly>=5.24",
    # AI assistant
    "anthropic>=0.40",
    "sqlglot>=25",
    "pyyaml>=6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "respx>=0.21",
    "kaleido>=1.0",
    "playwright>=1.45",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncoinsight", "dagster_project"]

[tool.dagster]
module_name = "dagster_project.definitions"
code_location_name = "oncoinsight"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/oncoinsight/target", "dbt/oncoinsight/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B023"]  # B023: closures in loops are invoked within the same iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Postgres warehouse"]
addopts = "-q"
