oncoinsight:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5433') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'oncoinsight') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'oncoinsight') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'oncoinsight') }}"
      schema: analytics
      threads: 6
    ci:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'oncoinsight') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'oncoinsight') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'oncoinsight') }}"
      schema: analytics
      threads: 4
